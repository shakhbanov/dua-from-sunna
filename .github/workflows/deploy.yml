name: Deploy to GitHub Pages

# Runs only when asked. Deploys are made from a laptop with
# scripts/deploy-gh-pages.sh, and nothing here should start by itself: the
# point is that switching Actions back on costs nothing and surprises nobody.
# GitHub's own "pages build and deployment" still runs on a push to gh-pages,
# and for a public repository it is free.
on:
  workflow_dispatch:

permissions:
  contents: write  # needed for peaceiris/actions-gh-pages

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: chapter dates are derived from it (scripts/generate-chapter-dates.mjs)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (client + SSR + prerender + sitemap + llms.txt)
        run: npm run build
        env:
          VITE_YANDEX_METRIKA_ID: ${{ secrets.VITE_YANDEX_METRIKA_ID }}

      - name: SEO checks — link graph, sitemap diff, canonicals, schema, budget, category refs
        run: npm run seo:check

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: dua.shakhbanov.org
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
          force_orphan: true  # single-commit history on gh-pages — keeps the branch small

      - name: Ping IndexNow (Bing + Yandex) — changed URLs only
        if: github.ref == 'refs/heads/main'
        continue-on-error: true  # IndexNow ping must never fail the deploy
        run: |
          # Give GitHub Pages a minute to propagate the new build before we announce URLs.
          sleep 60
          # Submit only URLs whose source files changed in this push.
          # Falls back to "all" automatically when shared code (router, SSR,
          # template, slugs) was touched — see indexnow-ping.mjs fan-out rules.
          npm run indexnow:changed -- ${{ github.event.before }}
